name: Build Node.js (glibc, aarch64)

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version (e.g. 24.15.0)'
        required: true
        default: '24.15.0'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    timeout-minutes: 180

    steps:
      - name: Validate node_version input
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          if [[ ! "$NODE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "ERROR: node_version must be a strict SemVer x.y.z (no leading zeros, no prerelease): got '$NODE_VERSION'" >&2
            exit 1
          fi
          echo "node_version validated: $NODE_VERSION"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential python3 git curl \
            libssl-dev zlib1g-dev libicu-dev \
            pkg-config cmake ccache

      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ccache
          key: ccache-nodejs-${{ inputs.node_version }}-arm64-v1
          restore-keys: |
            ccache-nodejs-${{ inputs.node_version }}-arm64-

      - name: Download Node.js source
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          VERSION="$NODE_VERSION"
          curl -fsSL "https://nodejs.org/dist/v${VERSION}/node-v${VERSION}.tar.xz" -o "node-v${VERSION}.tar.xz"
          curl -fsSL "https://nodejs.org/dist/v${VERSION}/SHASUMS256.txt" -o SHASUMS256.txt
          match_count=$(grep -Fc " node-v${VERSION}.tar.xz" SHASUMS256.txt || true)
          if [ "$match_count" -ne 1 ]; then
            echo "ERROR: expected exactly 1 SHASUMS256.txt entry for node-v${VERSION}.tar.xz, found $match_count" >&2
            exit 1
          fi
          grep -F " node-v${VERSION}.tar.xz" SHASUMS256.txt > expected.sha256
          sha256sum -c expected.sha256
          tar -xf "node-v${VERSION}.tar.xz"
          mv "node-v${VERSION}" node-src

      - name: Configure Node.js
        run: |
          cd node-src
          ./configure \
            --prefix=/opt/node-glibc \
            --with-intl=full-icu

      - name: Build Node.js
        run: |
          cd node-src
          CC="ccache gcc" CXX="ccache g++" make -j$(nproc)

      - name: Install Node.js
        run: |
          sudo mkdir -p /opt/node-glibc
          sudo chown "$USER" /opt/node-glibc
          cd node-src
          make install -j$(nproc) CC="ccache gcc" CXX="ccache g++"
          /opt/node-glibc/bin/node --version

      - name: Verify binary
        run: |
          file /opt/node-glibc/bin/node
          ldd /opt/node-glibc/bin/node
          /opt/node-glibc/bin/node -e "console.log('platform:', process.platform)"

      - name: Collect glibc dependencies
        run: |
          mkdir -p glibc-deps
          ldd /opt/node-glibc/bin/node | awk '{print $3}' | grep '/' | while read lib; do
            [ -f "$lib" ] && cp "$lib" glibc-deps/ && echo "copied: $lib"
          done
          ls -lh glibc-deps/
          find /lib /lib64 /usr/lib -name "ld-linux-aarch64.so.1" | head -1 | xargs -I{} cp {} glibc-deps/ 2>/dev/null || true

      - name: Create release archive
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          VERSION="$NODE_VERSION"
          mkdir -p release-artifact
          cp /opt/node-glibc/bin/node release-artifact/
          cp -r glibc-deps release-artifact/
          tar -czf "node-glibc-v${VERSION}-linux-arm64.tar.gz" -C release-artifact .
          sha256sum "node-glibc-v${VERSION}-linux-arm64.tar.gz" > "node-glibc-v${VERSION}-linux-arm64.tar.gz.sha256"
          echo "Archive created:"
          ls -lh "node-glibc-v${VERSION}-linux-arm64.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-glibc-v${{ inputs.node_version }}-linux-arm64
          path: |
            node-glibc-v${{ inputs.node_version }}-linux-arm64.tar.gz
            node-glibc-v${{ inputs.node_version }}-linux-arm64.tar.gz.sha256
          retention-days: 30

      - name: Create GitHub Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          NODE_VERSION_INPUT: ${{ inputs.node_version }}
        with:
          script: |
            const version = process.env.NODE_VERSION_INPUT;
            const tag = `node-glibc-v${version}`;
            const fs = require('fs');
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Node.js ${version} (glibc, aarch64)`,
                body: `glibc-linked Node.js ${version} for Android/Termux aarch64.\n\nBuilt on ubuntu-24.04-arm.`,
                prerelease: true,
              });
            } catch (e) {
              if (!e.message.includes('already_exists')) throw e;
            }
            const archive = `node-glibc-v${version}-linux-arm64.tar.gz`;
            const sha256 = `node-glibc-v${version}-linux-arm64.tar.gz.sha256`;
            for (const file of [archive, sha256]) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: (await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: tag,
                })).data.id,
                name: file,
                data: fs.readFileSync(file),
              });
            }

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ccache
          key: ccache-nodejs-${{ inputs.node_version }}-arm64-v1
