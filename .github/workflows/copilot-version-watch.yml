name: Copilot version watch

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

concurrency:
  group: copilot-manifest-write
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    env:
      WATCH_FAILURE_ISSUE_TITLE: "⚠️ Copilot version watch failed"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check latest @github/copilot version
        id: check_version
        run: |
          LATEST=$(npm view @github/copilot version)
          CURRENT=$(node -e "const m=require('./packages/copilot-termux/config/copilot-termux-release-manifest.json'); console.log(m.copilot_version || 'none')")
          echo "Latest: $LATEST"
          echo "Current: $CURRENT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "NEW VERSION DETECTED: $LATEST"
            echo "new_version=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "No new version"
          fi
      - name: Check for existing manifest PR
        if: steps.check_version.outputs.new_version != ''
        id: existing_pr_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/copilot-watch-${{ steps.check_version.outputs.new_version }}"
          own_pr=$(gh pr list --repo bash0816/Github-Copilot-Termux --base main --head "$branch" --state open \
            --json number,headRepositoryOwner \
            --jq '[.[] | select(.headRepositoryOwner.login == "bash0816")] | .[0].number // empty')
          if [ -n "$own_pr" ]; then
            echo "existing_own_pr=$own_pr" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            other_count=$(gh pr list --repo bash0816/Github-Copilot-Termux --base main --state open \
              --json title,headRepositoryOwner \
              --jq '[.[] | select(.headRepositoryOwner.login == "bash0816" and (.title | startswith("[copilot-manifest]")))] | length')
            if [ "$other_count" -gt 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping new intake: another manifest-write PR is open (count=$other_count). Version ${{ steps.check_version.outputs.new_version }} detection deferred until existing PR resolved."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Checkout target branch
        if: steps.check_version.outputs.new_version != '' && steps.existing_pr_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.check_version.outputs.new_version }}"
          branch="automation/copilot-watch-${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ steps.existing_pr_check.outputs.existing_own_pr }}" ]; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch" origin/main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Update manifest and package.json
        id: update_manifest
        if: steps.check_version.outputs.new_version != '' && steps.existing_pr_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.check_version.outputs.new_version }}"

          # Calculate expected_last_updated once and reuse
          expected_last_updated="$(node -e 'process.stdout.write(new Date().toISOString().slice(0, 10))')"

          # Update copilot-termux-release-manifest.json
          MANIFEST="packages/copilot-termux/config/copilot-termux-release-manifest.json"
          MANIFEST_ENV="$MANIFEST" NEW_VERSION_ENV="$NEW_VERSION" LAST_UPDATED_ENV="$expected_last_updated" node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync(process.env.MANIFEST_ENV, 'utf8'));
            m.copilot_version = process.env.NEW_VERSION_ENV;
            m.last_updated = process.env.LAST_UPDATED_ENV;
            m.candidate_state = 'none';
            m.canonical_package_status = 'not_published';
            m.latest_candidate_version = null;
            fs.writeFileSync(process.env.MANIFEST_ENV, JSON.stringify(m, null, 2) + '\n');
          "

          # Update package.json version
          PKG="packages/copilot-termux/package.json"
          PKG_ENV="$PKG" NEW_VERSION_ENV="$NEW_VERSION" node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync(process.env.PKG_ENV, 'utf8'));
            p.version = process.env.NEW_VERSION_ENV;
            fs.writeFileSync(process.env.PKG_ENV, JSON.stringify(p, null, 2) + '\n');
          "

          # Update config/manifest.json (MANIFEST-002: setup.js が実際に読むファイル)
          SETUP_MANIFEST="packages/copilot-termux/config/manifest.json"
          INTEGRITY=$(npm view "@github/copilot-linuxmusl-arm64@${NEW_VERSION}" dist.integrity 2>/dev/null | head -1)
          if [ -z "$INTEGRITY" ]; then
            echo "ERROR: Could not fetch integrity for @github/copilot-linuxmusl-arm64@${NEW_VERSION}"
            exit 1
          fi
          SETUP_MANIFEST_ENV="$SETUP_MANIFEST" NEW_VERSION_ENV="$NEW_VERSION" INTEGRITY_ENV="$INTEGRITY" node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync(process.env.SETUP_MANIFEST_ENV, 'utf8'));
            m.copilot.version = process.env.NEW_VERSION_ENV;
            m.copilot.integrity = process.env.INTEGRITY_ENV;
            fs.writeFileSync(process.env.SETUP_MANIFEST_ENV, JSON.stringify(m, null, 2) + '\n');
          "
          echo "Updated config/manifest.json: version=$NEW_VERSION"

          echo "Updated manifest and package.json to version: $NEW_VERSION"
          printf 'expected_last_updated=%s\n' "$expected_last_updated" >> "$GITHUB_OUTPUT"
      - name: Analyze NAPI exports for new version
        id: napi_audit
        if: steps.check_version.outputs.new_version != '' && steps.existing_pr_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.check_version.outputs.new_version }}"
          PACK_DIR="/tmp/copilot-pack"
          mkdir -p "$PACK_DIR"

          if ! TARBALL_NAME=$(npm pack "@github/copilot-linuxmusl-arm64@${NEW_VERSION}" --pack-destination "$PACK_DIR" | tail -n 1); then
            echo "audit_skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARBALL="$PACK_DIR/$TARBALL_NAME"
          RUNTIME_RELATIVE=$(tar -tf "$TARBALL" | grep '/runtime.node$' | head -n 1 || true)
          if [ -z "$RUNTIME_RELATIVE" ]; then
            echo "audit_skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNTIME="$PACK_DIR/runtime.node"
          tar -xOf "$TARBALL" "$RUNTIME_RELATIVE" > "$RUNTIME"

          # 監査結果本体はGITHUB_OUTPUT/envに乗せず、ランナーローカルの一時ファイルに直接書く。
          # (envブロック経由で渡すと、Actionsが自動的にログへ平文出力してしまうため。2026-07-19)
          node scripts/napi-audit.js "$RUNTIME" "$NEW_VERSION" --auto-patch > "$RUNNER_TEMP/napi_audit_result.json"

          # review_count/tokio_patch_ok/issue_needed の3値は、個別に
          # `echo "x=$(node -e ...)"` で埋め込むと node 側の例外時に `set -e` が
          # 発火せず値が空のまま後続処理へ流れてしまう(fail-open、2026-07-25判明)。
          # node呼び出しを1回に集約し直接 $GITHUB_OUTPUT に書くことで、
          # 例外時はこのコマンド自体が非ゼロ終了しset -eで止まる設計にする。
          node -e "
            const fs = require('fs');
            const { isIssueNeeded } = require('./scripts/napi-issue-body.js');
            const a = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/napi_audit_result.json', 'utf8'));
            const reviewCount = a.newUnknown.length + a.newPendingGitAsync.length + a.newStreamRisk.length;
            const lines = [
              'review_count=' + reviewCount,
              'tokio_patch_ok=' + a.tokioPatchOk,
              'issue_needed=' + isIssueNeeded(a),
            ];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join('\n') + '\n');
          "
          echo "audit_skipped=false" >> "$GITHUB_OUTPUT"
      - name: Check for existing NAPI audit issue (fingerprint-based)
        id: napi_issue_check
        if: steps.check_version.outputs.new_version != '' && steps.existing_pr_check.outputs.skip != 'true' && steps.napi_audit.outputs.audit_skipped != 'true' && steps.napi_audit.outputs.issue_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_PAT }}
          NAPI_AUDIT_FINGERPRINT_KEY: ${{ secrets.NAPI_AUDIT_FINGERPRINT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: RELEASE_ADMIN_PAT secret is not set" >&2
            exit 1
          fi
          fingerprint=$(node -e "
            const fs = require('fs');
            const { computeFingerprint } = require('./scripts/napi-safe-merge-decision.js');
            const audit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/napi_audit_result.json', 'utf8'));
            const candidateLists = {
              newPendingGitAsync: audit.newPendingGitAsync,
              newStreamRisk: audit.newStreamRisk,
            };
            process.stdout.write(computeFingerprint(candidateLists, process.env.NAPI_AUDIT_FINGERPRINT_KEY));
          ")
          existing=$(FINGERPRINT="$fingerprint" gh issue list --repo bash0816/Github-Copilot-Termux-Private \
            --state open --json number,title,body --limit 1000 \
            --jq '[.[] | select(.title | contains("要レビューの新規 NAPI エクスポートを検出")) | select(.body | contains("napi-audit-fingerprint: " + env.FINGERPRINT))] | .[0].number // empty')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          if [ -n "$existing" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "existing_issue_number=$existing" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create issue for unknown NAPI exports
        if: steps.check_version.outputs.new_version != '' && steps.existing_pr_check.outputs.skip != 'true' && steps.napi_audit.outputs.audit_skipped != 'true' && steps.napi_audit.outputs.issue_needed == 'true' && steps.napi_issue_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_PAT }}
          NEW_VERSION: ${{ steps.check_version.outputs.new_version }}
          NAPI_FINGERPRINT_FOR_BODY: ${{ steps.napi_issue_check.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: RELEASE_ADMIN_PAT secret is not set" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const { generateIssueBody } = require("./scripts/napi-issue-body.js");
            const audit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/napi_audit_result.json", "utf8"));
            const version = process.env.NEW_VERSION;
            const fingerprint = process.env.NAPI_FINGERPRINT_FOR_BODY;
            process.stdout.write(generateIssueBody(audit, version, fingerprint));
          ' | gh issue create --repo bash0816/Github-Copilot-Termux-Private --title "⚠️ copilot@${NEW_VERSION}: 要レビューの新規 NAPI エクスポートを検出" --body-file -
        id: create_napi_issue
      - name: Comment on existing matching NAPI issue
        if: steps.check_version.outputs.new_version != '' && steps.existing_pr_check.outputs.skip != 'true' && steps.napi_audit.outputs.audit_skipped != 'true' && steps.napi_audit.outputs.issue_needed == 'true' && steps.napi_issue_check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_PAT }}
          NEW_VERSION: ${{ steps.check_version.outputs.new_version }}
        run: |
          set -euo pipefail
          gh issue comment "${{ steps.napi_issue_check.outputs.existing_issue_number }}" \
            --repo bash0816/Github-Copilot-Termux-Private \
            --body "copilot@${NEW_VERSION}でも同一内容を再検出しました(自動)。"
      - name: Commit changes to branch
        if: steps.check_version.outputs.new_version != '' && steps.existing_pr_check.outputs.skip != 'true'
        id: commit_branch
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.check_version.outputs.new_version }}"
          branch="automation/copilot-watch-${NEW_VERSION}"

          git add packages/copilot-termux/config/copilot-termux-release-manifest.json packages/copilot-termux/config/manifest.json packages/copilot-termux/package.json packages/copilot-termux/lib/platform-patch.js config/napi-known-exports.json || true

          if [ -n "${{ steps.existing_pr_check.outputs.existing_own_pr }}" ]; then
            # 既存PRを再利用する場合、今回diffが無くても(既にpush済みの内容のまま)mergeリトライへ進む
            if git diff --staged --quiet; then
              echo "No new changes, but existing PR needs merge retry"
            else
              git commit -m "chore: detect copilot@${NEW_VERSION} and auto-update manifest/package.json"
              git push --force-with-lease origin "$branch"
            fi
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            if git diff --staged --quiet; then
              echo "No changes to commit"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore: detect copilot@${NEW_VERSION} and auto-update manifest/package.json"
              git push --force-with-lease origin "$branch"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "branch=$branch" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create or reuse manifest PR
        if: steps.commit_branch.outputs.has_changes == 'true'
        id: pr_create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ steps.commit_branch.outputs.branch }}"
          NEW_VERSION="${{ steps.check_version.outputs.new_version }}"
          if [ -n "${{ steps.existing_pr_check.outputs.existing_own_pr }}" ]; then
            pr_number="${{ steps.existing_pr_check.outputs.existing_own_pr }}"
            echo "Reusing existing PR #${pr_number}"
          else
            pr_url=$(gh pr create --base main --head "$branch" \
              --title "[copilot-manifest] Track copilot ${NEW_VERSION} candidate" \
              --body "Automated upstream copilot intake for version ${NEW_VERSION}.")
            pr_number=$(echo "$pr_url" | grep -oE '[0-9]+$')
            echo "PR created: $pr_url"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Determine safe-merge decision
        id: safe_merge_decision
        if: steps.commit_branch.outputs.has_changes == 'true'
        env:
          NAPI_AUDIT_FINGERPRINT_KEY: ${{ secrets.NAPI_AUDIT_FINGERPRINT_KEY }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const { decideSafeMerge } = require('./scripts/napi-safe-merge-decision.js');
            const updates = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/napi_audit_result.json', 'utf8'));
            const configRaw = fs.readFileSync('config/napi-known-exports.json', 'utf8');
            const baseline = JSON.parse(configRaw).deferred_review_baseline;
            const result = decideSafeMerge({
              updates,
              tokioPatchOk: '${{ steps.napi_audit.outputs.tokio_patch_ok }}' === 'true',
              auditSkipped: '${{ steps.napi_audit.outputs.audit_skipped }}' === 'true',
              baseline,
              hmacKey: process.env.NAPI_AUDIT_FINGERPRINT_KEY,
            });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'safe_merge=' + result.safeMerge + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'safe_merge_reason=' + result.reason + '\n');
          "
      - name: Safe-merge or leave for review
        id: safe_merge
        if: steps.commit_branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_PAT }}
        run: |
          set -euo pipefail

          post_review_comment() {
            local pr="$1"
            local reason="$2"
            local marker="<!-- copilot-watch-review-reason:${reason} -->"
            local existing
            existing=$(gh pr view "$pr" --json comments --jq '.comments[].body' | grep -Fqx "$marker" && echo "found" || echo "")
            if [ -z "$existing" ]; then
              gh pr comment "$pr" --body "${marker}
          自動マージをスキップしました(reason=${reason})。要人間レビュー: docs/operations/platform-patch-update-guide.md に従いbehavioral stub実装確認後にマージしてください。マージ後は手動でnpm-package.ymlをdispatchしてください。"
            fi
            echo "Manifest PR #${pr} left open for human review (reason=${reason})"
          }

          pr_number="${{ steps.pr_create.outputs.pr_number }}"
          safe_merge="${{ steps.safe_merge_decision.outputs.safe_merge }}"
          safe_merge_reason="${{ steps.safe_merge_decision.outputs.safe_merge_reason }}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: RELEASE_ADMIN_PAT secret is not set" >&2
            exit 1
          fi
          if ! gh api user >/dev/null 2>&1; then
            echo "ERROR: RELEASE_ADMIN_PAT is invalid or not authenticated" >&2
            exit 1
          fi

          if [ "$safe_merge" = "true" ]; then
            branch="${{ steps.commit_branch.outputs.branch }}"
            pr_head_sha=$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')
            git fetch origin main "$branch" "$pr_head_sha"
            pr_head_sha_recheck=$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')
            if [ "$pr_head_sha" != "$pr_head_sha_recheck" ]; then
              echo "ERROR: PR head changed during fetch/validation window. Aborting to avoid validating a stale commit." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor origin/main "$pr_head_sha_recheck"; then
              echo "ERROR: PR head does not include latest origin/main. Refusing to admin-merge to avoid rollback." >&2
              exit 1
            fi

            validation_json=$(PR_HEAD_SHA="$pr_head_sha_recheck" NEW_VERSION="${{ steps.check_version.outputs.new_version }}" EXPECTED_LAST_UPDATED="${{ steps.update_manifest.outputs.expected_last_updated }}" node scripts/napi-watch-merge-validate.js)
            validated_safe_merge=$(echo "$validation_json" | node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(0,'utf8')).safeMerge))")
            validated_reason=$(echo "$validation_json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).reason)")

            if [ "$validated_safe_merge" = "true" ]; then
              gh pr merge "$pr_number" --admin --squash --delete-branch --match-head-commit "$pr_head_sha_recheck"
              echo "safe_merged=true" >> "$GITHUB_OUTPUT"
              echo "Manifest PR #${pr_number} merged (admin bypass, reason=$validated_reason)"
            else
              echo "safe_merged=false" >> "$GITHUB_OUTPUT"
              post_review_comment "$pr_number" "$validated_reason"
            fi
          else
            echo "safe_merged=false" >> "$GITHUB_OUTPUT"
            post_review_comment "$pr_number" "$safe_merge_reason"
          fi
      - name: Dispatch npm-package verify
        if: steps.check_version.outputs.new_version != '' && steps.existing_pr_check.outputs.skip != 'true' && steps.safe_merge.outputs.safe_merged == 'true'
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.check_version.outputs.new_version }}"

          gh workflow run npm-package.yml \
            --repo bash0816/Github-Copilot-Termux \
            --field publish=false \
            --field retag_latest=false

          echo "Dispatched npm-package.yml verify (publish=false, retag_latest=false) for version ${NEW_VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check for existing failure issue
        if: failure()
        id: existing_failure_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(ISSUE_TITLE="$WATCH_FAILURE_ISSUE_TITLE" gh issue list --repo "${{ github.repository }}" \
            --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)] | .[0].number // empty')
          echo "existing_issue=$existing" >> "$GITHUB_OUTPUT"
      - name: Report workflow failure
        if: failure() && steps.existing_failure_issue.outputs.existing_issue == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create --repo "${{ github.repository }}" \
            --title "$WATCH_FAILURE_ISSUE_TITLE" \
            --body "Workflow run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Comment on existing failure issue
        if: failure() && steps.existing_failure_issue.outputs.existing_issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "${{ steps.existing_failure_issue.outputs.existing_issue }}" --repo "${{ github.repository }}" \
            --body "Recurred: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
