name: NAPI Baseline Init

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '現在検出されているnewPendingGitAsync/newStreamRisk/newUnknownの内容を人間が確認済みで、これを新しいbaselineとして記録することに同意する場合のみ "yes" と入力'
        required: true
        type: string

jobs:
  init-baseline:
    if: inputs.confirm == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Fetch latest upstream copilot version and extract runtime.node
        id: extract_runtime
        run: |
          set -euo pipefail
          LATEST=$(npm view @github/copilot version)
          echo "target_version=$LATEST" >> "$GITHUB_OUTPUT"
          PACK_DIR="/tmp/copilot-baseline-pack"
          mkdir -p "$PACK_DIR"
          TARBALL_NAME=$(npm pack "@github/copilot-linuxmusl-arm64@${LATEST}" --pack-destination "$PACK_DIR" | tail -n 1)
          TARBALL="$PACK_DIR/$TARBALL_NAME"
          RUNTIME_RELATIVE=$(tar -tf "$TARBALL" | grep '/runtime.node$' | head -n 1)
          RUNTIME="$PACK_DIR/runtime.node"
          tar -xOf "$TARBALL" "$RUNTIME_RELATIVE" > "$RUNTIME"
          node scripts/napi-audit.js "$RUNTIME" "$LATEST" > "$RUNNER_TEMP/napi_audit_result.json"
      - name: Compute and write baseline (secret never echoed)
        env:
          NAPI_AUDIT_FINGERPRINT_KEY: ${{ secrets.NAPI_AUDIT_FINGERPRINT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NAPI_AUDIT_FINGERPRINT_KEY:-}" ]; then
            echo "ERROR: NAPI_AUDIT_FINGERPRINT_KEY secret is not set" >&2
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const { computeFingerprint } = require('./scripts/napi-safe-merge-decision.js');
            const audit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/napi_audit_result.json', 'utf8'));
            const candidateLists = {
              newPendingGitAsync: audit.newPendingGitAsync,
              newStreamRisk: audit.newStreamRisk,
            };
            const fingerprint = computeFingerprint(candidateLists, process.env.NAPI_AUDIT_FINGERPRINT_KEY);
            const configPath = 'config/napi-known-exports.json';
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            config.deferred_review_baseline = {
              schema_version: 1,
              fingerprint,
              counts: {
                newPendingGitAsync: candidateLists.newPendingGitAsync.length,
                newStreamRisk: candidateLists.newStreamRisk.length,
                newUnknown: audit.newUnknown.length,
              },
              recorded_at: new Date().toISOString().slice(0, 10),
              recorded_from_version: audit.version,
            };
            fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          "
      - name: Create PR for human review
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_PAT }}
        run: |
          set -euo pipefail
          branch="automation/napi-baseline-init-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/napi-known-exports.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: initialize napi-audit deferred_review_baseline"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: initialize napi-audit deferred_review_baseline" \
            --body "napi-baseline-init.ymlの手動実行により生成。counts・recorded_at・recorded_from_versionを確認し、対応するprivate issue(#30関連の重複issue群)の内容と一致することを目視確認してからマージしてください。fingerprint自体はHMAC値のため中身の関数名は含まれません。"
