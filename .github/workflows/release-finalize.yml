name: Release finalize

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version'
        required: true
      release_notes:
        description: 'Release notes (optional)'
        default: ''
      source_sha:
        description: 'Source commit SHA (optional; empty = npm gitHead of the version)'
        required: false
        default: ''

concurrency:
  group: copilot-releases-write
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VER: ${{ inputs.version }}
      NOTES_INPUT: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate version format
        run: |
          set -eu
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-zA-Z.]+)?(\.[0-9]+)?$' || {
            echo "ERROR: Invalid version format: $VER" >&2
            exit 1
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify release readiness
        id: verify
        env:
          PKG_NAME: '@bash0816/copilot-termux'
          REPO: ${{ github.repository }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        run: bash scripts/release-finalize-check.sh

      - name: Create GitHub Release
        env:
          TAG_STATE: ${{ steps.verify.outputs.tag_state }}
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          NOTES="$NOTES_INPUT"
          [ -z "$NOTES" ] && NOTES="upstream @github/copilot@${VER} 追従。"

          # Release 存在判定は HTTP ステータスで行う。404 は非ゼロ終了でも「未作成」として扱い、
          # 200 以外かつ 404 以外（通信・認証・API エラー・ステータス取得不能）は停止する。
          if resp=$(gh api -i "repos/${REPO}/releases/tags/v${VER}" 2>&1); then
            api_rc=0
          else
            api_rc=$?
          fi
          status=$(printf '%s\n' "$resp" | sed -n 's#^HTTP/[0-9.]* \([0-9][0-9][0-9]\).*#\1#p' | sed -n '1p')
          case "$status" in
            200)
              if [ "$api_rc" -ne 0 ]; then
                echo "ERROR: release lookup returned 200 but gh exited ${api_rc}, stopping before any write" >&2
                echo "$resp" >&2
                exit 1
              fi
              release_state=exists
              ;;
            404) release_state=absent ;;
            *)
              echo "ERROR: release lookup failed (status='${status}'), stopping before any write" >&2
              echo "$resp" >&2
              exit 1
              ;;
          esac

          case "${TAG_STATE}:${release_state}" in
            match:exists)
              echo "Release v${VER} already exists and tag matches source (${SOURCE_SHA}), skipping creation"
              ;;
            match:absent)
              gh release create "v${VER}" --title "v${VER}" --notes "$NOTES" --latest
              ;;
            absent:absent)
              gh release create "v${VER}" --target "$SOURCE_SHA" --title "v${VER}" --notes "$NOTES" --latest
              ;;
            absent:exists)
              echo "ERROR: release v${VER} exists but tag v${VER} does not (unexpected, check manually)" >&2
              exit 1
              ;;
            *)
              echo "ERROR: unexpected state tag_state=${TAG_STATE} release=${release_state}" >&2
              exit 1
              ;;
          esac

      - name: Update RELEASES.md on feature branch then open PR
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="automation/copilot-releases-${VER}"

          own_pr=$(gh pr list --repo bash0816/Github-Copilot-Termux --base main --head "$branch" --state open \
            --json number,headRepositoryOwner --jq '[.[] | select(.headRepositoryOwner.login == "bash0816")] | .[0].number // empty')
          if [ -n "$own_pr" ]; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch" origin/main
          fi

          date_str=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          notes="$NOTES_INPUT"
          [ -z "$notes" ] && notes="upstream \`@github/copilot@${VER}\` 追従。"

          if [ -f RELEASES.md ] && grep -qE "^## ${VER}([[:space:]]|$)" RELEASES.md; then
            echo "RELEASES.md already has ${VER} entry"
          else
            sed -i 's/ 🚀 Latest \/ 最新版/ \/ 旧版/' RELEASES.md
            entry=$(
              printf '## %s — %s 🚀 Latest / 最新版\n\n' "$VER" "$date_str"
              printf '%s\n\n' "$notes"
              printf '### Install\n\n'
              printf '```sh\n'
              printf 'npm install -g @bash0816/copilot-termux@latest\n'
              printf 'copilot-termux setup\n'
              printf 'copilot --version\n'
              printf '```\n\n'
              printf -- '---\n\n'
            )
            printf '%s\n' "$entry" > /tmp/new_entry.md
            if [ -f RELEASES.md ]; then
              cat /tmp/new_entry.md RELEASES.md > /tmp/releases_new.md
              mv /tmp/releases_new.md RELEASES.md
            else
              mv /tmp/new_entry.md RELEASES.md
            fi
          fi

          git add RELEASES.md
          if git diff --cached --quiet; then
            echo "No new changes to RELEASES.md"
          else
            git commit -m "docs: update RELEASES.md for ${VER}"
            git push --force-with-lease origin "$branch"
          fi

          if [ -n "$own_pr" ]; then
            pr_number="$own_pr"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            if git log origin/main.."$branch" --oneline | grep -q .; then
              pr_url=$(gh pr create --base main --head "$branch" --title "[copilot-manifest] docs: update RELEASES.md for ${VER}" --body "Automated RELEASES.md update for @bash0816/copilot-termux@${VER}.")
              pr_number=$(echo "$pr_url" | grep -oE '[0-9]+$')
              echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
              echo "branch=$branch" >> "$GITHUB_OUTPUT"
            else
              echo "No PR needed (no commits ahead of main)"
            fi
          fi
        id: releases_pr

      - name: Admin merge RELEASES.md PR
        if: steps.releases_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_PAT }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: RELEASE_ADMIN_PAT secret is not set" >&2
            exit 1
          fi
          if ! gh api user >/dev/null 2>&1; then
            echo "ERROR: RELEASE_ADMIN_PAT is invalid or not authenticated" >&2
            exit 1
          fi
          pr_number="${{ steps.releases_pr.outputs.pr_number }}"
          expected_branch="${{ steps.releases_pr.outputs.branch }}"

          verify_pr_state() {
            local sha="$1"
            local pr_json
            pr_json=$(gh pr view "$pr_number" --json state,baseRefName,headRefName,headRepositoryOwner,headRefOid)
            local state base head_ref head_owner head_sha
            state=$(echo "$pr_json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).state)")
            base=$(echo "$pr_json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).baseRefName)")
            head_ref=$(echo "$pr_json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).headRefName)")
            head_owner=$(echo "$pr_json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).headRepositoryOwner.login)")
            head_sha=$(echo "$pr_json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).headRefOid)")
            if [ "$state" != "OPEN" ] || [ "$base" != "main" ] || [ "$head_ref" != "$expected_branch" ] || [ "$head_owner" != "bash0816" ] || [ "$head_sha" != "$sha" ]; then
              echo "ERROR: PR #${pr_number} identity check failed (state=$state base=$base head_ref=$head_ref head_owner=$head_owner head_sha=$head_sha expected_sha=$sha)" >&2
              return 1
            fi
            return 0
          }

          verify_file_scope() {
            local sha="$1"
            git diff --name-status -z --no-renames origin/main "$sha" | node -e "
              const chunks = [];
              process.stdin.on('data', c => chunks.push(c));
              process.stdin.on('end', () => {
                const buf = Buffer.concat(chunks);
                const parts = buf.toString('utf8').split('\0').filter(p => p.length > 0);
                if (parts.length % 2 !== 0 || parts.length === 0) {
                  console.error('Unexpected diff output format');
                  process.exit(1);
                }
                const entries = [];
                for (let i = 0; i < parts.length; i += 2) {
                  entries.push({ status: parts[i], path: parts[i + 1] });
                }
                const allowed = entries.every(e => (e.status === 'A' || e.status === 'M') && e.path === 'RELEASES.md');
                if (!allowed) {
                  console.error('Disallowed diff:', JSON.stringify(entries));
                  process.exit(1);
                }
                console.log('File scope OK:', JSON.stringify(entries));
              });
            "
          }

          pr_head_sha=$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')
          git fetch origin main "$expected_branch" "$pr_head_sha"
          pr_head_sha_recheck=$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')
          if [ "$pr_head_sha" != "$pr_head_sha_recheck" ]; then
            echo "ERROR: PR head changed during fetch/validation window. Aborting to avoid validating a stale commit." >&2
            exit 1
          fi
          verify_pr_state "$pr_head_sha_recheck" || exit 1
          if ! git merge-base --is-ancestor origin/main "$pr_head_sha_recheck"; then
            echo "ERROR: PR head does not include latest origin/main. Refusing to admin-merge to avoid rollback." >&2
            exit 1
          fi
          verify_file_scope "$pr_head_sha_recheck"

          # Re-fetch origin/main immediately before merge and re-verify against the freshest base
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main "$pr_head_sha_recheck"; then
            echo "ERROR: PR head does not include latest origin/main (post-refresh). Refusing to admin-merge to avoid rollback." >&2
            exit 1
          fi
          verify_file_scope "$pr_head_sha_recheck"
          verify_pr_state "$pr_head_sha_recheck" || exit 1

          gh pr merge "$pr_number" --admin --squash --delete-branch --match-head-commit "$pr_head_sha_recheck"
